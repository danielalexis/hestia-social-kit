<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../src/colors_and_type.css">
<style>html,body{margin:0;background:#E9E5DD}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <symbol id="loom" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <rect x="3" y="4" width="18" height="16" rx="1.5"></rect>
      <path d="M7 4v16M11 4v16M15 4v16M19 4v16"></path>
      <path d="M3 12h18"></path>
      <rect x="9" y="11" width="6" height="2" rx="0.5" fill="currentColor" opacity=".15"></rect>
    </symbol>

    <symbol id="roll" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <ellipse cx="6" cy="12" rx="3" ry="8"></ellipse>
      <path d="M6 4h12a3 8 0 0 1 0 16H6"></path>
      <path d="M9 8h9M9 12h9M9 16h9"></path>
    </symbol>

    <symbol id="lot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <path d="M20.5 11.5 13 4H5a1 1 0 0 0-1 1v8l8.5 8.5a1.4 1.4 0 0 0 2 0l6-6a1.4 1.4 0 0 0 0-2z"></path>
      <circle cx="8.5" cy="8.5" r="1.5"></circle>
      <path d="M11 13h4M11 16h2"></path>
    </symbol>

    <symbol id="shade" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <rect x="3" y="6" width="4" height="14" rx="0.5"></rect>
      <rect x="8" y="4" width="4" height="16" rx="0.5"></rect>
      <rect x="13" y="6" width="4" height="14" rx="0.5"></rect>
      <rect x="18" y="8" width="3" height="12" rx="0.5"></rect>
    </symbol>

    <symbol id="gsm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <path d="M4 7h16l-1.5 9a2 2 0 0 1-2 1.7H7.5a2 2 0 0 1-2-1.7z"></path>
      <path d="M9 7V5a3 3 0 0 1 6 0v2"></path>
      <path d="M10 12h4M9 15h6"></path>
    </symbol>

    <symbol id="dye-bath" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <path d="M4 6h16v11a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"></path>
      <path d="M4 13c2 1 4 1 6 0s4-1 6 0 4 1 4 0"></path>
      <path d="M12 2c1.5 1.8 2.5 3.2 2.5 4.5a2.5 2.5 0 0 1-5 0C9.5 5.2 10.5 3.8 12 2z" fill="currentColor" opacity=".15"></path>
    </symbol>

    <symbol id="quality-hold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      <path d="M10 9v6M14 9v6"></path>
    </symbol>

    <symbol id="dpp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <rect x="4" y="2" width="16" height="20" rx="2"></rect>
      <path d="M8 7h8"></path>
      <rect x="8" y="11" width="3" height="3"></rect>
      <rect x="13" y="11" width="3" height="3"></rect>
      <rect x="8" y="16" width="3" height="3"></rect>
      <path d="M13 16h3M13 19h2"></path>
    </symbol>

    <symbol id="thread" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <path d="M5 4h14M5 20h14"></path>
      <path d="M7 4v16M17 4v16"></path>
      <path d="M7 7c2 1 4 1 5 0s3-1 5 0"></path>
      <path d="M7 11c2 1 4 1 5 0s3-1 5 0"></path>
      <path d="M7 15c2 1 4 1 5 0s3-1 5 0"></path>
    </symbol>

    <symbol id="pattern" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <path d="M3 8h18M3 12h18M3 16h18"></path>
      <path d="M8 3v18M12 3v18M16 3v18"></path>
    </symbol>

    <symbol id="cut-piece" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <circle cx="6" cy="7" r="2"></circle>
      <circle cx="6" cy="17" r="2"></circle>
      <path d="M8.5 8.5 20 17M8.5 15.5 20 7"></path>
      <path d="M14 11l3 1"></path>
    </symbol>

    <symbol id="order-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <path d="M3 8a2 2 0 0 1 2-2h6l9 9-7 7-9-9z"></path>
      <circle cx="8" cy="11" r="1.5"></circle>
    </symbol>
  </defs>
</svg>

<div id="artboard" style="position:relative;width:1200px;height:1200px;background:#060E24;padding:88px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column">
        <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,0.045) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,rgba(255,255,255,0.045) 0 1px,transparent 1px 8px);pointer-events:none"></div>
        <div style="position:absolute;top:-160px;right:-120px;width:640px;height:640px;border-radius:9999px;background:rgba(0,61,165,0.55);filter:blur(120px);pointer-events:none"></div>
        <div style="position:relative;font:700 22px 'Geist',sans-serif;letter-spacing:0.18em;text-transform:uppercase;color:#8AA4E8">O próximo passo</div>
        <div style="position:relative;margin-top:auto">
          <div style="font:700 84px 'Geist',sans-serif;letter-spacing:-0.038em;line-height:1.06;color:#FFFFFF;text-wrap:pretty">Pronto para modernizar a sua fábrica têxtil?</div>
          <div style="font:400 32px 'Geist',sans-serif;line-height:1.45;color:rgba(255,255,255,0.72);margin-top:32px;max-width:860px">Adira ao programa de acesso antecipado do Hestia ERP. Vagas limitadas para unidades no Norte de Portugal.</div>
          <div style="margin-top:56px;padding:24px 44px;border-radius:14px;background:#FFFFFF;color:#060E24;font:600 30px 'Geist',sans-serif;display:inline-block">Marcar demonstração</div>
        </div>
        <div style="position:relative;display:flex;align-items:center;gap:20px;margin-top:72px">
          <img src="../assets/logo-white.svg" alt="Hestia" style="height:36px">
          <span style="font:400 20px 'Geist Mono',monospace;color:rgba(255,255,255,0.6)">hestiatechnology.pt</span>
        </div>
      </div>
</body>
</html>
