<!doctype html>

<body>
<div id="artboard" style="position:relative;width:1200px;height:627px;background:var(--background);border:1px solid var(--border);padding:64px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:row;gap:56px">
        <div style="flex:0 0 260px;background:#FFFFFF;border:1px solid var(--border);border-radius:12px;padding:32px;display:flex;flex-direction:column;justify-content:center;gap:6px;box-shadow:0 1px 2px rgba(10,15,28,0.06)">
          <div style="font:500 20px 'Geist Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;color:#003DA5">Nov</div>
          <div style="font:800 108px 'Geist',sans-serif;letter-spacing:-0.045em;line-height:0.95;color:#0A0F1C">12</div>

          <div style="margin-top:auto;display:flex;align-items:center;gap:24px">
            <span style="padding:16px 32px;border-radius:10px;background:#003DA5;color:#FFFFFF;font:600 22px 'Geist',sans-serif">Save your seat</span>
            <span style="font:400 22px 'Geist Mono',monospace;color:#4B5262">Online · EN</span>
          </div>
        </div>
      </div>
