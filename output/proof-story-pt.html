<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../src/colors_and_type.css">
<style>html,body{margin:0;background:#E9E5DD}</style>
</head>
<body>
<div id="artboard" style="position:relative;width:1080px;height:1920px;background:var(--background);border:1px solid var(--border);padding:200px 80px 200px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column">
        <div style="font:700 22px 'Geist',sans-serif;letter-spacing:0.18em;text-transform:uppercase;color:#003DA5">Porque mudam</div>
        <div style="font:700 88px 'Geist',sans-serif;letter-spacing:-0.038em;line-height:1.04;color:#0A0F1C;margin-top:32px;text-wrap:pretty">Subscrição, cloud e prontos para 2027.</div>
        <div style="display:flex;flex-direction:column;gap:0;margin-top:72px;border-top:1px solid var(--border)">
        <div style="display:flex;align-items:baseline;gap:32px;padding:40px 0;border-bottom:1px solid var(--border)">
          <div style="flex:0 0 300px;font:800 84px 'Geist',sans-serif;letter-spacing:-0.045em;color:#003DA5">2–4</div>
          <div style="font:400 32px 'Geist',sans-serif;line-height:1.35;color:#4B5262">semanas até arrancar, não meses</div>
        </div>
        <div style="display:flex;align-items:baseline;gap:32px;padding:40px 0;border-bottom:1px solid var(--border)">
          <div style="flex:0 0 300px;font:800 84px 'Geist',sans-serif;letter-spacing:-0.045em;color:#003DA5">100%</div>
          <div style="font:400 32px 'Geist',sans-serif;line-height:1.35;color:#4B5262">alojado na UE, conforme por omissão</div>
        </div>
        <div style="display:flex;align-items:baseline;gap:32px;padding:40px 0;border-bottom:1px solid var(--border)">
          <div style="flex:0 0 300px;font:800 84px 'Geist',sans-serif;letter-spacing:-0.045em;color:#003DA5">2027</div>
          <div style="font:400 32px 'Geist',sans-serif;line-height:1.35;color:#4B5262">prazo do DPP, já assegurado</div>
        </div></div>
        
  <div style="display:flex;align-items:center;gap:20px;margin-top:auto">
    <img src="../assets/logo.svg" alt="Hestia" style="height:40px">
    <span style="font:400 20px 'Geist Mono',monospace;color:#4B5262">hestiatechnology.pt</span>
  </div>
      </div>
</body>
