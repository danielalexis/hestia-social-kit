<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../src/colors_and_type.css">
<style>html,body{margin:0;background:#E9E5DD}</style>
</head>
<body>
<div id="artboard" style="position:relative;width:1200px;height:1200px;background:var(--background);border:1px solid var(--border);padding:88px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column">
        <div style="font:700 22px 'Geist',sans-serif;letter-spacing:0.18em;text-transform:uppercase;color:#003DA5">Point of view</div>
        <div style="font:600 68px 'Geist',sans-serif;letter-spacing:-0.03em;line-height:1.18;color:#0A0F1C;margin-top:48px;text-wrap:pretty">“Textile plants don't need another ERP. They need a system that already speaks their language — lots, shades, GSM, dye baths.”</div>
        <div style="display:flex;align-items:center;gap:28px;margin-top:56px">
          <img src="../assets/CEO.jpg" alt="Portrait" style="width:132px;height:132px;border-radius:9999px;object-fit:cover;border:1px solid var(--border)">
          <div style="display:flex;flex-direction:column;gap:8px">
            <div style="font:600 30px 'Geist',sans-serif;letter-spacing:-0.02em;color:#0A0F1C">CEO &amp; Co-Founder</div>
            <div style="font:400 26px 'Geist',sans-serif;color:#4B5262">Hestia Technology · Barcelos, PT</div>
          </div>
        </div>
        
  <div style="display:flex;align-items:center;gap:20px;margin-top:auto">
    <img src="../assets/logo.svg" alt="Hestia" style="height:36px">
    <span style="font:400 20px 'Geist Mono',monospace;color:#4B5262">hestiatechnology.pt</span>
  </div>
      </div>
</body>
</html>
