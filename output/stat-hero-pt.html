<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../src/colors_and_type.css">
<style>html,body{margin:0;background:#E9E5DD}</style>
</head>
<body>
<div id="artboard" style="position:relative;width:1200px;height:1200px;background:#060E24;padding:88px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column">
        <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,0.045) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,rgba(255,255,255,0.045) 0 1px,transparent 1px 8px);pointer-events:none"></div>
        <div style="position:absolute;top:-180px;right:-140px;width:620px;height:620px;border-radius:9999px;background:rgba(0,61,165,0.5);filter:blur(120px);pointer-events:none"></div>
        <div style="position:relative;font:700 22px 'Geist',sans-serif;letter-spacing:0.18em;text-transform:uppercase;color:#8AA4E8">Comparação</div>
        <div style="position:relative;margin-top:auto">
          <div style="font:800 216px 'Geist',sans-serif;letter-spacing:-0.045em;line-height:0.9;color:#FFFFFF">2–4</div>
          <div style="font:600 72px 'Geist',sans-serif;letter-spacing:-0.03em;color:#FFFFFF;margin-top:8px">semanas até arrancar</div>
          <div style="font:400 32px 'Geist',sans-serif;line-height:1.45;color:rgba(255,255,255,0.72);margin-top:32px;max-width:820px">Os ERPs legados levam 2–4 meses, exigem licença perpétua e não suportam o Passaporte Digital do Produto.</div>
        </div>
        <div style="position:relative;display:flex;align-items:center;gap:20px;margin-top:80px">
          <img src="../assets/logo-white.svg" alt="Hestia" style="height:36px">
          <span style="font:400 20px 'Geist Mono',monospace;color:rgba(255,255,255,0.6)">hestiatechnology.pt</span>
        </div>
      </div>
</body>
</html>
