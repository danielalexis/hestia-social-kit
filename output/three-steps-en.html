<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../src/colors_and_type.css">
<style>html,body{margin:0;background:#E9E5DD}</style>
</head>
<body>
<div id="artboard" style="position:relative;width:1080px;height:1080px;background:var(--background);border:1px solid var(--border);padding:80px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column">
        <div style="font:700 20px 'Geist',sans-serif;letter-spacing:0.18em;text-transform:uppercase;color:#003DA5">The process</div>
        <div style="font:700 72px 'Geist',sans-serif;letter-spacing:-0.035em;line-height:1.05;color:#0A0F1C;margin-top:28px">Live in three steps.</div>
        <div style="display:flex;flex-direction:column;gap:20px;margin-top:52px">
        <div style="display:flex;gap:28px;align-items:flex-start;background:#FFFFFF;border:1px solid var(--border);border-radius:12px;padding:32px;box-shadow:0 1px 2px rgba(10,15,28,0.06)">
          <div style="flex:0 0 auto;font:500 26px 'Geist Mono',monospace;color:#003DA5;padding-top:4px">01</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="font:600 38px 'Geist',sans-serif;letter-spacing:-0.025em;color:#0A0F1C">Connect Your Data</div>
            <div style="font:400 26px 'Geist',sans-serif;line-height:1.4;color:#4B5262">Machines, orders and stock, in hours — not weeks.</div>
          </div>
        </div>
        <div style="display:flex;gap:28px;align-items:flex-start;background:#FFFFFF;border:1px solid var(--border);border-radius:12px;padding:32px;box-shadow:0 1px 2px rgba(10,15,28,0.06)">
          <div style="flex:0 0 auto;font:500 26px 'Geist Mono',monospace;color:#003DA5;padding-top:4px">02</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="font:600 38px 'Geist',sans-serif;letter-spacing:-0.025em;color:#0A0F1C">Analyze in Real-Time</div>
            <div style="font:400 26px 'Geist',sans-serif;line-height:1.4;color:#4B5262">Output, downtime and rejects on one live board.</div>
          </div>
        </div>
        <div style="display:flex;gap:28px;align-items:flex-start;background:#FFFFFF;border:1px solid var(--border);border-radius:12px;padding:32px;box-shadow:0 1px 2px rgba(10,15,28,0.06)">
          <div style="flex:0 0 auto;font:500 26px 'Geist Mono',monospace;color:#003DA5;padding-top:4px">03</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="font:600 38px 'Geist',sans-serif;letter-spacing:-0.025em;color:#0A0F1C">Scale with Compliance</div>
            <div style="font:400 26px 'Geist',sans-serif;line-height:1.4;color:#4B5262">DPP and EU rules update themselves. You keep shipping.</div>
          </div>
        </div></div>
        
  <div style="display:flex;align-items:center;gap:20px;margin-top:auto">
    <img src="../assets/logo.svg" alt="Hestia" style="height:34px">
    <span style="font:400 20px 'Geist Mono',monospace;color:#4B5262">hestiatechnology.pt</span>
  </div>
      </div>
</body>
</html>
